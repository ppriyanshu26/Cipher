<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>AES Encryption/Decryption</h1>
    <form method="POST" onsubmit="return validateForm()">
        <div class="form-group">
            <label>Mode:</label>
            <input type="radio" name="mode" value="encrypt" id="encrypt" {% if mode != 'decrypt' %}checked{% endif %} onchange="updateLabels()"> 
            <label for="encrypt" style="display:inline">Encrypt</label>
            
            <input type="radio" name="mode" value="decrypt" id="decrypt" {% if mode == 'decrypt' %}checked{% endif %} onchange="updateLabels()"> 
            <label for="decrypt" style="display:inline">Decrypt</label>
        </div>

        <div class="form-group">
            <label id="text-label" for="text">Plaintext:</label>
            <textarea name="text" id="text" rows="4" required>{{ input_text if input_text else '' }}</textarea>
        </div>

        <div class="form-group">
            <label for="key">Key (min 8 chars):</label>
            <input type="text" name="key" id="key" required value="{{ key if key else '' }}">
        </div>

        <div class="form-group">
            <label for="api_key">API Key:</label>
            <input type="text" name="api_key" id="api_key" required value="{{ api_key if api_key else '' }}">
        </div>

        <button type="submit">Submit</button>
    </form>

    <div id="result-container">
        {% if result %}
        <div class="result">
            <strong>Result:</strong>
            <p id="output-content">{{ result }}</p>
            <button type="button" onclick="copyResult()">Copy</button>
        </div>
        {% endif %}

        {% if error %}
        <div class="result error-mode">
            <strong>ERROR:</strong>
            <p id="output-content">{{ error }}</p>
            <button type="button" onclick="copyResult()">Copy</button>
        </div>
        {% endif %}
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
